<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #1f2937;
        background: #f3f4f6;
      }

      main {
        max-width: 900px;
        margin: 0 auto;
      }

      .project-card {
        padding: 1.5rem;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 4px 16px rgb(0 0 0 / 8%);
      }

      .project-image {
        display: block;
        width: 100%;
        max-width: 600px;
        height: auto;
        margin: 1rem 0;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="projects" aria-labelledby="projects-heading">
        <h1 id="projects-heading">My Projects</h1>

        <article class="project-card">
          <h2>Student Management System</h2>
          <img
            class="project-image"
            src="student-system.png"
            alt="Screenshot of the Student Management System"
          />
          <p>
            A Java and MySQL project used for managing student information.
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
